<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enygma — Login</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <main class="site-shell auth-shell">
    <header class="site-header">
      <a class="brand" href="index.html">enygma</a>
      <a class="back-link" href="index.html">Site</a>
    </header>

    <section class="auth-heading">
      <p class="eyebrow">Players</p>
      <h1>Log in</h1>
      <p>Create an account to save your results, track your records, and compete in the rankings.</p>
    </section>

    <section class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab active" data-panel="login-panel">Log in</button>
        <button class="auth-tab" data-panel="register-panel">Create account</button>
      </div>

      <form id="login-panel" class="stack-form auth-form">
        <label>Username<input id="login-username" autocomplete="username" required /></label>
        <label>Password<input id="login-password" type="password" autocomplete="current-password" required /></label>
        <button type="submit">Log in</button>
        <p id="login-message" class="form-message" role="alert"></p>
      </form>

      <form id="register-panel" class="stack-form auth-form hidden">
        <label>Username<input id="register-username" autocomplete="username" required /></label>
        <label>Password<input id="register-password" type="password" autocomplete="new-password" minlength="10" required /></label>
        <label>Confirm password<input id="register-confirm" type="password" autocomplete="new-password" minlength="10" required /></label>
        <button type="submit">Create account</button>
        <p id="register-message" class="form-message" role="alert"></p>
      </form>
    </section>

    <footer class="site-footer">enygma</footer>
  </main>
  <script src="assets/auth.js"></script>
</body>
</html>
