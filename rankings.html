<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enygma — Rankings</title>
  <link rel="stylesheet" href="assets/styles.css" />
  <link rel="stylesheet" href="assets/rankings.css" />
</head>
<body>
  <main class="site-shell rankings-shell">
    <header class="site-header">
      <a class="brand" href="index.html">enygma</a>
      <nav class="account-nav"><a href="profile.html">Profile</a><a href="login.html">Log in</a></nav>
    </header>

    <section class="rankings-heading">
      <p class="eyebrow">Players</p>
      <h1>Rankings</h1>
      <p>Compete for points across all three games.</p>
    </section>

    <div class="ranking-tabs" role="tablist">
      <button class="ranking-tab active" data-category="all">Total</button>
      <button class="ranking-tab" data-category="connections">Connections</button>
      <button class="ranking-tab" data-category="crosswords">Crosswords</button>
      <button class="ranking-tab" data-category="pyramids">Pyramids</button>
    </div>

    <section class="ranking-table-wrap">
      <div class="ranking-table-head"><span>Rank</span><span>Player</span><span>Played</span><span>Solved</span><span>Total time</span><span>Average time</span><span>Points</span></div>
      <div id="ranking-list"></div>
    </section>
    <footer class="site-footer">enygma</footer>
  </main>
  <script src="assets/rankings.js"></script>
</body>
</html>
