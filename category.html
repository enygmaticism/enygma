<!doctype html>
<html lang="en">
<head>

  <title>Enygma</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <main class="site-shell">
    <header class="site-header">
      <a class="brand" href="index.html">enygma</a>
      <a class="back-link" href="index.html">← All games</a>
    </header>

    <section class="category-heading">
      <p class="eyebrow" id="category-label">Game</p>
      <h1 id="category-title">Loading…</h1>
      <p id="category-description"></p>

    <section class="latest-panel">
      <div class="section-label">Latest</div>
      <div id="latest-entry"></div>

    <section class="archive-section">
      <div class="section-heading">
        <div>
          <div class="section-label">Archive</div>
          <h2>Previous entries</h2>
        </div>
      </div>
      <div id="archive-list" class="archive-list"></div>

    <footer class="site-footer">enygma</footer>

  <script src="assets/app.js"></script>

</html>
